<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAST REACTION V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="home" class="page">
  <div class="logo">FAST<span>REACTION</span></div>
  <p>Regarde l'écran. Le pixel va changer.</p>
  <input id="name" placeholder="Ton pseudo" maxlength="16">
  <button id="create">CRÉER UN SALON</button>
  <div class="or">OU</div>
  <input id="code" placeholder="CODE À 6 CHIFFRES" inputmode="numeric" maxlength="6">
  <button id="join" class="dark">REJOINDRE</button>
  <div id="err"></div>
</div>

<div id="room" class="page hidden">
  <div class="bar">
    <div>CODE <b id="roomCode"></b></div>
    <div>CRÉDITS <b id="credits">1000</b></div>
  </div>
  <h1>SALON</h1>
  <p>Le pixel va changer de couleur. Clique dessus dès que tu le vois.</p>
  <div id="players"></div>
  <div class="settings">
    <label>Mise fictive
      <input id="stake" type="number" min="1" max="1000" value="10">
    </label>
    <button id="start">LANCER LA PARTIE</button>
  </div>
</div>

<div id="game" class="game hidden">
  <div class="gamebar">
    <span>MANCHE <b id="round"></b></span>
    <span>POT <b id="pot"></b></span>
  </div>
  <div id="message">OBSERVE BIEN…</div>
  <div id="arena">
    <div id="pixel" aria-label="pixel"></div>
  </div>
  <div id="winner"></div>
  <div id="scores"></div>
  <button id="again" class="dark">RETOUR AU SALON</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
