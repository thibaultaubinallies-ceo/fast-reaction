<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Reaction V4</title><link rel="stylesheet" href="/style.css"></head><body><header><b>⚡ FAST REACTION</b><span id="balance">Solde : 100,00 €</span></header><main>
<section id="home"><h1>Ta réactivité fait la différence.</h1><p>Couleur et forme changent à chaque manche.</p><input id="name" placeholder="Ton pseudo" maxlength="20"><button id="createBtn">Créer un salon</button><button id="showJoin">Rejoindre un salon</button><div id="join" class="hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="Code du salon"><button id="joinBtn">Rejoindre</button></div></section>
<section id="lobby" class="hidden"><h2>Salon <span id="roomCode"></span></h2><p>Mise : <input id="stake" type="number" value="10" min="1"> € &nbsp; Pot : <b id="pot">0,00 €</b></p><div id="players"></div><button id="start">Lancer la partie</button><small>Crédits virtuels de test.</small></section>
<section id="game" class="hidden"><div class="hud">Pot <b id="gamePot">0,00 €</b> <span id="status">Préparez-vous…</span></div><div id="arena"><div id="target"></div><div id="msg">Préparez-vous…</div></div><div id="winner" class="hidden"><div class="money">💶 ✨ 💶 ✨ 💶</div><h1>🏆 GAGNANT !</h1><h2 id="winnerName"></h2><strong id="prize"></strong><p id="reaction"></p><button id="again">Rejouer</button></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
